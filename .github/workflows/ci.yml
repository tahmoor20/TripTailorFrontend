name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: |
          status=0
          npx tsc --noEmit --pretty false > tsc.log || status=$?
          cat tsc.log
          node scripts/annotate-tsc.js tsc.log
          exit $status

      - name: Test
        if: always()
        run: npx jest --ci --json --outputFile=jest-results.json

      - name: Annotate failing tests
        if: failure()
        run: node scripts/annotate-jest-failures.js jest-results.json
